name: Rank Hourly Build

# 실시간 화제 랭킹 집계 자동화. rank/scripts/collect-rank.mjs 로
# issue/config/sources.json 의 활성 RSS 소스를 수집·점수화해
# rank/data/ranking.json 을 갱신하고 커밋/푸시한다.
# 배포는 deploy.yml 의 workflow_run 트리거가 담당 (issue-daily 와 동일 패턴).
#
# Schedule: 매시 13분 (스탬프드 회피). 실패 시 이전 데이터 유지.

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 랭킹 집계
        run: node rank/scripts/collect-rank.mjs

      - name: 데이터 검증
        run: node -e "const j=require('./rank/data/ranking.json'); if(!j.top||!j.top.length){process.exit(1)}; if(!j.generated_at){process.exit(1)}; console.log('OK', j.top.length, 'ranked items');"

      - name: Commit and push
        run: |
          git config user.name "GlobalHot Bot"
          git config user.email "bot@globalhot.net"
          git add rank/data/ranking.json
          if git diff --cached --quiet; then
            echo "No changes to commit (ranking unchanged)."
          else
            git commit -m "chore(rank): hourly ranking update"
            git push
          fi
