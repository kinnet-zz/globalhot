name: 주 2회 경제 이슈 편집 초안

on:
  schedule:
    # 화·금요일 06:30 KST (GitHub Actions cron은 UTC)
    - cron: '30 21 * * 1,4'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 테스트
        run: npm test

      - name: 경제 이슈 조사 초안 생성
        id: editorial
        env:
          SITE_URL:       ${{ vars.SITE_URL || 'https://globalhot.net' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   gemini-3.1-flash-lite
        run: node scripts/generate-editorial-draft.mjs

      - name: 편집 품질 검사
        run: npm run audit

      - name: 검토 브랜치 생성
        id: branch
        run: |
          BRANCH="editorial/${{ github.run_id }}-$(date '+%Y-%m-%d')"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name  "GlobalHot Bot"
          git config user.email "bot@globalhot.pages.dev"
          git checkout -b "$BRANCH"
          git add posts/ sitemap.xml index.html
          git commit -m "draft: 경제 이슈 편집 검토 $(date '+%Y-%m-%d')"
          git push --set-upstream origin "$BRANCH"

      - name: 편집 검토 PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
          POST_PATH: ${{ steps.editorial.outputs.post_path }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "편집 검토: $(date '+%Y-%m-%d') 경제 이슈 분석" \
            --body-file .github/editorial-pr-template.md
