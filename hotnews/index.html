<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핫이슈 - Reddit Gravure & Models</title>
<link rel="stylesheet" href="hotnews.css">
</head>
<body>

<div id="header">
  <h1>🔥 핫이슈 게시판</h1>
  <p class="subtitle">Reddit gravure/model 핫포스트 수집기</p>
</div>

<div id="search-mobile">
  <input type="text" id="mobile-search" placeholder="검색...">
</div>

<div id="container">
  <div id="sidebar">
    <div class="filter-section">
      <h3>📋 서브레딧</h3>
      <div class="sub-list">
        <a href="#sub=all" class="sub-btn on" data-sub="all">전체</a>
        <!-- sub buttons injected by data -->
      </div>
    </div>
    
    <div class="filter-section">
      <h3>⏰ 시간대</h3>
      <div class="time-list">
        <a href="#time=all" class="time-btn on" data-time="all">전체</a>
        <a href="#time=3h" class="time-btn" data-time="3h">3시간</a>
        <a href="#time=6h" class="time-btn" data-time="6h">6시간</a>
        <a href="#time=12h" class="time-btn" data-time="12h">12시간</a>
        <a href="#time=24h" class="time-btn" data-time="24h">24시간</a>
        <a href="#time=week" class="time-btn" data-time="week">1주일</a>
      </div>
    </div>
    
    <div class="filter-section">
      <h3>📊 정렬</h3>
      <div class="sort-list">
        <a href="#sort=score" class="sort-btn on" data-sort="score">인기순</a>
        <a href="#sort=comments" class="sort-btn" data-sort="comments">댓글순</a>
        <a href="#sort=time" class="sort-btn" data-sort="time">최신순</a>
        <a href="#sort=ups" class="sort-btn" data-sort="ups">업보투순</a>
      </div>
    </div>
    
    <div class="filter-section">
      <h3>🖼 옵션</h3>
      <div class="option-list">
        <a href="#thumb=on" class="opt-btn" data-thumb="on">썸네일 켜기</a>
      </div>
    </div>
  </div>
  
  <div id="main">
    <div class="post-count">
      <span id="post-count">로딩중...</span>
    </div>
    
    <table class="post-list">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th class="content">제목</th>
          <th class="meta">정보</th>
        </tr>
      </thead>
      <tbody id="post-tbody">
        <tr><td colspan="3" class="empty">로딩중...</td></tr>
      </tbody>
    </table>
    
    <div class="update-info" id="update-info"></div>
  </div>
</div>

<button id="refresh-btn" title="새로고침" onclick="location.reload()">↻</button>

<!-- Posts data will be injected here by build script -->
<script id="hotnews-data" type="application/json">[]</script>
<script src="hotnews.js"></script>

</body>
</html>
