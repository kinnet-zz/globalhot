  <style>
    .profile-main{min-height:calc(100vh - 220px);background:#fff;padding:40px 0 72px}
    .profile-shell{width:min(980px,calc(100% - 40px));margin:0 auto}
    .profile-header{display:flex;gap:26px;align-items:flex-start;margin-bottom:30px}
    .profile-photo{flex:0 0 300px;max-width:300px}
    .profile-photo .portrait{width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#eae6dc}
    .profile-photo .portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
    .profile-copy{flex:1;min-width:0}
    .profile-copy .eyebrow{color:var(--coral-soft);letter-spacing:.15em;font-size:.68rem;font-weight:900;margin:0 0 10px}
    .profile-copy h1{margin:0;color:var(--ink);font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.1;letter-spacing:-.03em}
    .profile-copy h1 small{display:block;margin-top:6px;color:var(--muted);font-size:.9rem;letter-spacing:0}
    .profile-meta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;color:var(--muted);font-size:.85rem}
    .profile-meta span{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
    .profile-rank{display:inline-flex;align-items:baseline;gap:10px;margin-top:16px;padding:8px 16px;border:1px solid rgba(201,66,44,.5);border-radius:6px;background:rgba(201,66,44,.06)}.profile-rank span{color:var(--coral-soft);font-size:.68rem;font-weight:900;letter-spacing:.16em}.profile-rank strong{color:var(--coral-soft);font-size:1.05rem;font-weight:950}
    .profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
    .profile-actions a{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;background:var(--coral);border:1px solid var(--coral);color:#fff;font-size:.82rem;font-weight:800;text-decoration:none;border-radius:6px}
    .photo-open{display:inline-flex;align-items:center;gap:6px;margin-top:12px;color:var(--muted);font-size:.74rem;font-weight:700;text-decoration:none}
    .photo-open:hover{color:var(--coral-soft)}
    .photo-open svg{width:.92rem;height:.92rem;flex-shrink:0}
    .profile-actions a.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
    .profile-actions a:hover{background:var(--coral-soft);border-color:var(--coral-soft);color:#fff}
    .profile-section{border-top:1px solid var(--line);padding:26px 0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px}
    .profile-section h2{color:var(--ink);font-size:1.12rem;font-weight:900;margin:0 0 14px}
    .profile-bio{color:var(--muted);font-size:.96rem;line-height:1.82;white-space:pre-line}
    .profile-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .profile-tags span{padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.75rem;background:#fff}
    .profile-rail dl{display:grid;gap:12px;margin:0}
    .profile-rail .photo-credit{margin:18px 0 0;color:var(--quiet);font-size:.72rem;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
    .profile-rail .photo-credit a{color:var(--coral-soft);text-decoration:underline;text-underline-offset:2px}
    .profile-rail dt{color:var(--quiet);font-size:.7rem;font-weight:700;letter-spacing:.06em}
    .profile-rail dd{margin:3px 0 0;color:var(--ink);font-size:.9rem;line-height:1.5}
    .back-link{display:inline-block;margin-bottom:24px;color:var(--muted);font-size:.84rem;text-decoration:none}
    .back-link:hover{color:var(--coral-soft)}
    .load-state{display:grid;place-items:center;min-height:40vh;color:var(--muted)}
    .profile-ad{display:flex;justify-content:center;margin-top:28px}
    .profile-actions a:focus-visible,.back-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .profile-section h2:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .profile-rail a{color:var(--coral-soft);text-decoration:underline;text-underline-offset:2px}
    .profile-related{border-top:1px solid var(--line);padding:26px 0 0;margin-top:26px}
    .profile-related h2{color:var(--ink);font-size:1.12rem;font-weight:900;margin:0 0 18px}
    .profile-comments{border-top:1px solid var(--line);padding:26px 0 0;margin-top:26px}
    .profile-comments h2{color:var(--ink);font-size:1.12rem;font-weight:900;margin:0 0 16px}
    .comments-form{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
    .comments-form input,.comments-form textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff}
    .comments-form textarea{min-height:90px;resize:vertical}
    .comments-form input:focus,.comments-form textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
    .comments-form .comment-actions{display:flex;align-items:center;gap:12px}
    .comments-form button{border:1px solid var(--coral);background:var(--coral);color:#fff;font-size:.82rem;font-weight:800;padding:0 16px;min-height:40px;border-radius:6px;cursor:pointer}
    .comments-form button:disabled{opacity:.55;cursor:not-allowed}
    .comments-form .comment-status{color:var(--muted);font-size:.8rem;font-weight:700}
    .comments-form .comment-error{color:var(--coral-soft);font-size:.8rem;font-weight:700}
    .comment-list{display:flex;flex-direction:column;gap:16px}
    .comment-item{border-bottom:1px solid var(--line);padding-bottom:14px}
    .comment-item:last-child{border-bottom:none}
    .comment-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
    .comment-head strong{color:var(--ink);font-size:.86rem;font-weight:800}
    .comment-head time{color:var(--quiet);font-size:.72rem}
    .comment-body{color:var(--muted);font-size:.9rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .comments-empty{color:var(--quiet);font-size:.86rem;padding:8px 0}
    .comments-load{color:var(--quiet);font-size:.84rem;padding:6px 0}
    .related-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .related-card{display:flex;align-items:center;gap:12px;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;text-decoration:none}
    .related-card:hover{border-color:var(--h-verm);box-shadow:0 0 0 1px var(--h-verm)}
    .related-thumb{flex:0 0 52px;height:64px;border-radius:5px;overflow:hidden;background:#eae6dc}
    .related-thumb img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
    .related-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
    .related-copy strong{color:var(--h-ink);font-size:.86rem;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .related-copy em{color:var(--h-faint);font-size:.7rem;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .profile-related .related-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    @media(max-width:700px){.profile-header{flex-direction:column}.profile-photo{flex:0 0 auto;width:min(280px,58%)}.profile-section{grid-template-columns:1fr;gap:18px}.profile-shell{width:min(100% - 28px,980px)}.related-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>

  <script>
    (function () {
      'use strict';
      var modelsJsonUrl = '/data/models.json';
      var stateEl = document.getElementById('profileState');
      if (!stateEl) return;

      function buildMonogram(name) {
        if (!name) return '';
        var parts = String(name).split(/\s+/).filter(Boolean);
        return parts.slice(0, 2).map(function (p) { return p.charAt(0); }).join('').toUpperCase();
      }

      function profileImgSrc(model) {
        if (model && typeof model.photoUrl === 'string' && model.photoUrl.indexOf('/assets/profiles/') === -1 && /^https:\/\//.test(model.photoUrl)) {
          return model.photoUrl.replace(/\/thumb\/(.+?)\/(\d+)px-/, '/thumb/$1/640px-');
        }
        return model && model.id ? '/assets/profiles/' + encodeURIComponent(model.id) + '.jpg' : '';
      }

      function syncMeta(model) {
        var imgSrc = profileImgSrc(model);
        var photoUrl = model.photoAvailable && imgSrc
          ? (/^https?:\/\//.test(imgSrc) ? imgSrc : 'https://globalhot.net' + imgSrc)
          : '';
        var desc = (model.bio || model.name + ' GlobalHot 공식 프로필').slice(0, 160);
        setMeta('og:title', 'property', model.name + ' | GlobalHot');
        setMeta('og:description', 'property', desc);
        setMeta('twitter:title', 'name', model.name + ' | GlobalHot');
        setMeta('twitter:description', 'name', desc);
        var ogImage = document.querySelector('meta[property="og:image"]');
        if (!ogImage && photoUrl) {
          ogImage = document.createElement('meta');
          ogImage.setAttribute('property', 'og:image');
          document.head.appendChild(ogImage);
        }
        if (ogImage) ogImage.setAttribute('content', photoUrl);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute('href', 'https://globalhot.net/model.html?id=' + encodeURIComponent(model.id));
      }

      function setMeta(key, attr, value) {
        var el = document.querySelector('meta[' + attr + '="' + key + '"]');
        if (el) el.setAttribute('content', value);
      }

      function applyMonogramFallback(model, portrait) {
        var monogram = buildMonogram(model.name);
        portrait.setAttribute('data-monogram', monogram);
        portrait.setAttribute('aria-label', model.name + ' 프로필 사진 (모노그램)');
        var brokenImg = portrait.querySelector('img');
        if (brokenImg && brokenImg.parentNode) brokenImg.parentNode.removeChild(brokenImg);
        if (!portrait.querySelector('span')) {
          var noPhotoSpan = document.createElement('span');
          noPhotoSpan.textContent = 'NO PHOTO';
          portrait.appendChild(noPhotoSpan);
        }
      }

      function safeAnchor(href, label, ghost) {
        var a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = label;
        if (ghost) a.className = 'ghost';
        return a;
      }

      function categoryOf(model) {
        var tags = String(model.tags || '').toLowerCase();
        if (tags.indexOf('gravure') !== -1) return 'gravure';
        if (tags.indexOf('cosplay') !== -1) return 'cosplay';
        return 'model';
      }

      // Mirrors portal.js priorityOf: gravure > cosplay/bikini/swimsuit/racing > rest.
      function priorityOf(model) {
        if (!model || typeof model.tags !== 'string') return 3;
        var tags = model.tags.toLowerCase();
        if (tags.indexOf('gravure') !== -1) return 0;
        if (tags.indexOf('cosplay') !== -1) return 1;
        if (tags.indexOf('bikini') !== -1 || tags.indexOf('swimsuit') !== -1 || tags.indexOf('racing') !== -1) return 1;
        return 2;
      }

      // Rank mirrors the homepage directory order with the same tiebreak
      // (name, ko) so a model's detail badge matches its home feed position.
      function computeRank(model, models) {
        if (!model || !Array.isArray(models)) return null;
        var published = models.filter(function (m) { return m && m.photoAvailable === true; });
        published.sort(function (a, b) {
          var diff = priorityOf(a) - priorityOf(b);
          if (diff !== 0) return diff;
          return String((a && a.name) || '').localeCompare(String((b && b.name) || ''), 'ko');
        });
        for (var i = 0; i < published.length; i += 1) {
          if (published[i].id === model.id) return i + 1;
        }
        return null;
      }

      function mount(model, rank) {
        syncMeta(model);
        document.title = model.name + ' | GlobalHot';

        var header = document.createElement('div');
        header.className = 'profile-header';

        var photo = document.createElement('div');
        photo.className = 'profile-photo';
        var portrait = document.createElement('div');
        portrait.className = 'portrait';
        portrait.setAttribute('role', 'img');
        if (model.photoAvailable) {
          portrait.setAttribute('aria-label', model.name + ' 프로필 사진');
          var img = document.createElement('img');
          img.src = profileImgSrc(model);
          img.alt = model.name + ' 프로필 사진';
          img.addEventListener('error', function () { applyMonogramFallback(model, portrait); });
          portrait.appendChild(img);
        } else {
          applyMonogramFallback(model, portrait);
        }
        photo.appendChild(portrait);

        // New-tab shortcut to the original file: CC photos are worth seeing at
        // full resolution when the profile layout only shows a 300px crop.
        if (model.photoAvailable) {
          var openLink = document.createElement('a');
          openLink.className = 'photo-open';
          openLink.href = profileImgSrc(model);
          openLink.target = '_blank';
          openLink.rel = 'noopener noreferrer';
          openLink.setAttribute('aria-label', model.name + ' 원본 사진 열기 (새 창)');
          var openIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          openIcon.setAttribute('viewBox', '0 0 24 24');
          openIcon.setAttribute('fill', 'none');
          openIcon.setAttribute('stroke', 'currentColor');
          openIcon.setAttribute('stroke-width', '2');
          openIcon.setAttribute('stroke-linecap', 'round');
          openIcon.setAttribute('stroke-linejoin', 'round');
          openIcon.setAttribute('aria-hidden', 'true');
          var iconCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          iconCircle.setAttribute('cx', '11'); iconCircle.setAttribute('cy', '11'); iconCircle.setAttribute('r', '7');
          openIcon.appendChild(iconCircle);
          var iconLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          iconLine.setAttribute('x1', '16.5'); iconLine.setAttribute('y1', '16.5'); iconLine.setAttribute('x2', '21'); iconLine.setAttribute('y2', '21');
          openIcon.appendChild(iconLine);
          openLink.appendChild(openIcon);
          openLink.appendChild(document.createTextNode('원본 사진'));
          photo.appendChild(openLink);
        }

        var copy = document.createElement('div');
        copy.className = 'profile-copy';

        var eyebrow = document.createElement('p');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = (model.category || 'MODEL').toUpperCase() + ' PROFILE';
        copy.appendChild(eyebrow);

        var h1 = document.createElement('h1');
        h1.textContent = model.name;
        if (model.altName) {
          var small = document.createElement('small');
          small.textContent = model.altName;
          h1.appendChild(small);
        }
        copy.appendChild(h1);

        if (rank) {
          var rankBadge = document.createElement('div');
          rankBadge.className = 'profile-rank';
          var rankLabel = document.createElement('span');
          rankLabel.textContent = 'RANK';
          var rankValue = document.createElement('strong');
          rankValue.textContent = '#' + rank;
          rankBadge.append(rankLabel, rankValue);
          copy.appendChild(rankBadge);
        }

        var meta = document.createElement('div');
        meta.className = 'profile-meta';
        [
          ['국가', model.country],
        ].forEach(function (pair) {
          var span = document.createElement('span');
          span.textContent = pair[0] + ': ' + pair[1];
          meta.appendChild(span);
        });
        copy.appendChild(meta);

        var actions = document.createElement('div');
        actions.className = 'profile-actions';
        if (model.officialUrl) actions.appendChild(safeAnchor(model.officialUrl, '공식 프로필'));
        if (model.sns && model.sns.x) actions.appendChild(safeAnchor(model.sns.x, 'X', true));
        if (model.sns && model.sns.instagram) actions.appendChild(safeAnchor(model.sns.instagram, 'Instagram', true));
        if (model.sns && model.sns.youtube) actions.appendChild(safeAnchor(model.sns.youtube, 'YouTube', true));
        copy.appendChild(actions);

        header.appendChild(photo);
        header.appendChild(copy);
        stateEl.replaceWith(header);

        var section = document.createElement('section');
        section.className = 'profile-section';
        if (model.bio) {
          var bioCol = document.createElement('div');
          var bioTitle = document.createElement('h2');
          bioTitle.textContent = '모델 소개';
          bioCol.appendChild(bioTitle);
          var bio = document.createElement('p');
          bio.className = 'profile-bio';
          bio.textContent = model.bio;
          bioCol.appendChild(bio);
          section.appendChild(bioCol);
        }
        if (model.tags) {
          var tags = document.createElement('div');
          tags.className = 'profile-tags';
          String(model.tags).split(/\s+/).filter(Boolean).forEach(function (tag) {
            var span = document.createElement('span');
            span.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
            tags.appendChild(span);
          });
          section.appendChild(tags);
        }

        var rail = document.createElement('aside');
        rail.className = 'profile-rail';
        var dl = document.createElement('dl');

        var categoryTerm = document.createElement('dt');
        categoryTerm.textContent = '카테고리';
        var categoryValue = document.createElement('dd');
        categoryValue.textContent = String(categoryOf(model)).toUpperCase();
        dl.appendChild(categoryTerm);
        dl.appendChild(categoryValue);

        var countryTerm = document.createElement('dt');
        countryTerm.textContent = '국가';
        var countryValue = document.createElement('dd');
        countryValue.textContent = model.country;
        dl.appendChild(countryTerm);
        dl.appendChild(countryValue);

        if (model.photoUrl && model.license) {
          var licenseTerm = document.createElement('dt');
          licenseTerm.textContent = '라이선스';
          var licenseValue = document.createElement('dd');
          licenseValue.textContent = model.license;
          dl.appendChild(licenseTerm);
          dl.appendChild(licenseValue);
        }
        rail.appendChild(dl);

        // Photo attribution only for remote (Wikimedia) images where we have a
        // real license + credit. Local downloads publish no per-photo credit.
        if (model.photoUrl && model.creditText) {
          var credit = document.createElement('p');
          credit.className = 'photo-credit';
          credit.appendChild(document.createTextNode('사진 출처: '));
          if (model.creditUrl) {
            credit.appendChild(safeAnchor(model.creditUrl, model.creditText));
          } else {
            credit.appendChild(document.createTextNode(model.creditText));
          }
rail.appendChild(credit);
        }

        section.appendChild(rail);
        header.after(section);
        return section;
      }

      // Same-field navigation: up to four published profiles in the same
      // category, ordered with the same priority + ko-name tiebreak used by the
      // directory, excluding the current profile. Mirrors the home feed so the
      // detail page feels like part of the same registry.
      function relatedProfilesOf(model, models, limit) {
        if (!model || !Array.isArray(models)) return [];
        var limitN = Number.isFinite(limit) ? limit : 4;
        var category = categoryOf(model);
        return models.filter(function (m) {
          return m && m.photoAvailable === true && m.id !== model.id && categoryOf(m) === category;
        }).sort(function (a, b) {
          var diff = priorityOf(a) - priorityOf(b);
          if (diff !== 0) return diff;
          return String((a && a.name) || '').localeCompare(String((b && b.name) || ''), 'ko');
        }).slice(0, limitN);
      }

      function buildRelatedGrid(related, nav) {
        var grid = document.createElement('div');
        grid.className = 'related-grid';
        related.forEach(function (item, index) {
          var link = document.createElement('a');
          link.className = 'related-card';
          link.href = '/model.html?id=' + encodeURIComponent(item.id);
          link.setAttribute('data-related-index', String(index));

          var thumb = document.createElement('span');
          thumb.className = 'related-thumb';
          thumb.setAttribute('role', 'img');
          var makeFallback = function () {
            thumb.setAttribute('data-monogram', buildMonogram(item.name));
            var imgEl = thumb.querySelector('img');
            if (imgEl && imgEl.parentNode) imgEl.parentNode.removeChild(imgEl);
          };
          if (item.photoAvailable) {
            var img = document.createElement('img');
            img.src = profileImgSrc(item);
            img.alt = item.name;
            img.setAttribute('loading', 'lazy');
            img.addEventListener('error', makeFallback);
            thumb.appendChild(img);
          } else {
            makeFallback();
          }
          link.appendChild(thumb);

          var label = document.createElement('span');
          label.className = 'related-copy';
          var name = document.createElement('strong');
          name.textContent = item.name;
          label.appendChild(name);
          if (item.altName) {
            var sub = document.createElement('em');
            sub.textContent = item.altName;
            label.appendChild(sub);
          }
          link.appendChild(label);
          grid.appendChild(link);
        });
        nav.appendChild(grid);
      }

      function renderModel(model, rank, models) {
        model.category = categoryOf(model);
        var section = mount(model, rank);
        var anchor = section || document.querySelector('.profile-section') || document.querySelector('.profile-header');
        if (!anchor || !anchor.parentNode) return;
        var related = relatedProfilesOf(model, models || [], 4);
        if (related.length) {
          var nav = document.createElement('section');
          nav.className = 'profile-related';
          nav.setAttribute('aria-labelledby', 'related-title');
          var heading = document.createElement('h2');
          heading.id = 'related-title';
          heading.textContent = '같은 분야 등록 프로필';
          nav.appendChild(heading);
          buildRelatedGrid(related, nav);
          anchor.parentNode.appendChild(nav);
        }
        anchor.parentNode.appendChild(buildCommentsSection(model));
      }

      function formatCommentDate(iso) {
        var date = new Date(iso);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
      }

      function buildCommentsSection(model) {
        var section = document.createElement('section');
        section.className = 'profile-comments';
        section.setAttribute('aria-labelledby', 'comments-title');
        var heading = document.createElement('h2');
        heading.id = 'comments-title';
        heading.textContent = '댓글';
        section.appendChild(heading);

        var form = document.createElement('form');
        form.className = 'comments-form';
        form.setAttribute('novalidate', '');

        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.name = 'authorName';
        nameInput.placeholder = '닉네임 (1~24자)';
        nameInput.maxLength = 24;
        nameInput.autocomplete = 'nickname';
        form.appendChild(nameInput);

        var contentInput = document.createElement('textarea');
        contentInput.name = 'content';
        contentInput.placeholder = '모델 프로필에 대한 댓글을 남겨 주세요.';
        contentInput.maxLength = 2000;
        form.appendChild(contentInput);

        var actions = document.createElement('div');
        actions.className = 'comment-actions';
        var submit = document.createElement('button');
        submit.type = 'submit';
        submit.textContent = '댓글 등록';
        actions.appendChild(submit);
        var status = document.createElement('span');
        status.className = 'comment-status';
        status.setAttribute('role', 'status');
        actions.appendChild(status);
        form.appendChild(actions);

        var list = document.createElement('div');
        list.className = 'comment-list';
        var listState = document.createElement('p');
        listState.className = 'comments-load';
        listState.textContent = '댓글을 불러오는 중...';
        list.appendChild(listState);
        section.appendChild(form);
        section.appendChild(list);

        var endpoint = '/api/comments/' + encodeURIComponent(model.id);
        function renderList(comments) {
          list.replaceChildren();
          if (!comments || !comments.length) {
            var empty = document.createElement('p');
            empty.className = 'comments-empty';
            empty.textContent = '아직 댓글이 없습니다. 첫 번째 댓글을 남겨 보세요.';
            list.appendChild(empty);
            return;
          }
          comments.forEach(function (comment) {
            var item = document.createElement('div');
            item.className = 'comment-item';
            var head = document.createElement('div');
            head.className = 'comment-head';
            var strong = document.createElement('strong');
            strong.textContent = comment && comment.authorName ? comment.authorName : '익명';
            head.appendChild(strong);
            if (comment && comment.createdAt) {
              var time = document.createElement('time');
              time.textContent = formatCommentDate(comment.createdAt);
              time.dateTime = comment.createdAt;
              head.appendChild(time);
            }
            item.appendChild(head);
            var body = document.createElement('p');
            body.className = 'comment-body';
            body.textContent = (comment && comment.content) || '';
            item.appendChild(body);
            list.appendChild(item);
          });
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var name = nameInput.value.trim();
          var content = contentInput.value.trim();
          submit.disabled = true;
          status.textContent = '';
          window.fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ authorName: name, content: content }),
          }).then(function (response) {
            if (!response.ok) {
              return response.json().then(function (payload) {
                var message = payload && payload.error ? payload.error.message : '댓글을 등록하지 못했습니다.';
                throw new Error(message);
              });
            }
            return response.json();
          }).then(function () {
            nameInput.value = '';
            contentInput.value = '';
            status.textContent = '댓글이 등록되었습니다.';
            return window.fetch(endpoint, { cache: 'no-cache' });
          }).then(function (response) { return response.json(); })
            .then(function (payload) { renderList(payload && payload.comments); })
            .catch(function (error) {
              status.className = 'comment-error';
              status.textContent = (error && error.message) || '댓글을 등록하지 못했습니다.';
            })
            .finally(function () { submit.disabled = false; });
        });

        window.fetch(endpoint, { cache: 'no-cache' })
          .then(function (response) {
            if (!response.ok) throw new Error('load_failed');
            return response.json();
          })
          .then(function (payload) { renderList(payload && payload.comments); })
          .catch(function () {
            list.replaceChildren();
            var fallback = document.createElement('p');
            fallback.className = 'comments-load';
            fallback.textContent = '댓글을 불러올 수 없습니다.';
            list.appendChild(fallback);
          });

        return section;
      }

      function showMissing() {
        stateEl.replaceChildren();
        var p = document.createElement('p');
        p.textContent = '요청하신 모델 프로필을 찾을 수 없습니다.';
        stateEl.appendChild(p);
        var a = document.createElement('a');
        a.className = 'ghost';
        a.href = '/#models';
        a.textContent = '모든 프로필 보기';
        stateEl.appendChild(a);
      }

      function findModel(models, id) {
        if (!Array.isArray(models)) return null;
        for (var i = 0; i < models.length; i += 1) {
          if (models[i] && models[i].id === id) return models[i];
        }
        return null;
      }

      var id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        showMissing();
        return;
      }
      window.fetch(modelsJsonUrl, { headers: { Accept: 'application/json' }, cache: 'no-cache' })
        .then(function (response) { if (!response || !response.ok) throw new Error('load_failed'); return response.json(); })
        .then(function (data) {
          var model = findModel(data.models, id);
          if (!model) throw new Error('not_found');
          renderModel(model, computeRank(model, data.models), data.models);
        })
        .catch(function () {
          if (stateEl) showMissing();
        });
    }());
  </script>
</body>
</html>
