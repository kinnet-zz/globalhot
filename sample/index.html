<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X 화제영상 게시판 — 샘플</title>
<style>
  :root {
    --bg: #0e1117;
    --card: #161b24;
    --card-hover: #1b2230;
    --border: #262f3f;
    --accent: #1d9bf0;
    --accent-hover: #1585d8;
    --text: #e7ecf3;
    --muted: #8a97ab;
    --tag-bg: #1e2a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 .x { color: var(--accent); }
  header .desc { color: var(--muted); font-size: 13px; }
  .toolbar {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    flex-wrap: wrap;
  }
  .toolbar input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); }
  #urlInput { flex: 2 1 320px; }
  #tagInput { flex: 1 1 140px; }
  .toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar button:hover { background: var(--accent-hover); }
  .filters {
    display: flex;
    gap: 8px;
    padding: 0 24px 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters .label { color: var(--muted); font-size: 13px; }
  .chip {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.active { color: #fff; border-color: var(--accent); background: rgba(29,155,240,.15); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 8px 24px 40px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { border-color: #3a4a63; }
  /* 임베드 영역 (실제 서비스에선 X 위젯 렌더링) */
  .embed {
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #10151f 0%, #182234 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    position: relative;
  }
  .embed .play {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(29,155,240,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(29,155,240,.35);
  }
  .embed .play::after {
    content: '';
    border-style: solid;
    border-width: 11px 0 11px 18px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }
  .embed .placeholder-note { position: absolute; bottom: 8px; right: 10px; font-size: 11px; opacity: .6; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .author { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1d9bf0, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  .author .name { font-size: 14px; font-weight: 600; }
  .author .handle { font-size: 12px; color: var(--muted); }
  .text { font-size: 13px; color: #c3cddb; line-height: 1.5; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }
  .actions a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .actions button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .actions button:hover { color: #ff6b6b; border-color: #ff6b6b; }
  .empty {
    padding: 60px;
    text-align: center;
    color: var(--muted);
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2a3c;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🎬 X <span class="x">화제영상</span> 게시판</h1>
    <div class="desc">X 게시물 URL을 붙여넣으면 공식 임베드로 재생됩니다 · 영상 다운로드/복제 없음</div>
  </div>
</header>

<div class="toolbar">
  <input id="urlInput" type="text" placeholder="https://x.com/사용자/status/123456789 ..." />
  <input id="tagInput" type="text" placeholder="태그 (예: 그라비아, 화제)" />
  <button onclick="addPost()">추가</button>
</div>

<div class="filters" id="filters">
  <span class="label">태그 필터</span>
  <!-- JS 생성 -->
</div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<script>
// ── 샘플 데이터 (실제 서비스: DB + X oEmbed 메타데이터) ──
let posts = [
  { id: 1, tweetUrl: "https://x.com/example/status/111", authorName: "샘플 계정 A", authorHandle: "@sample_a", text: "이번 주 화제 영상 클립 🎥 (샘플 데이터 — 실제로는 X 공식 임베드가 렌더링됩니다)", tags: ["화제", "영상"], date: "2026-08-26" },
  { id: 2, tweetUrl: "https://x.com/example/status/222", authorName: "샘플 계정 B", authorHandle: "@sample_b", text: "포토월 비하인드 컷 공개 ✨ (임베드 카드 샘플)", tags: ["그라비아"], date: "2026-08-25" },
  { id: 3, tweetUrl: "https://x.com/example/status/333", authorName: "샘플 계정 C", authorHandle: "@sample_c", text: "최근 반응이 제일 많았던 클립 모음 (샘플)", tags: ["화제", "인기"], date: "2026-08-24" },
];

let activeTag = "전체";

function allTags() {
  const set = new Set();
  posts.forEach(p => p.tags.forEach(t => set.add(t)));
  return ["전체", ...set];
}

function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = '<span class="label">태그 필터</span>' + allTags().map(t =>
    `<span class="chip ${t === activeTag ? "active" : ""}" onclick="setTag('${t}')">${t}</span>`
  ).join("");
}

function setTag(t) { activeTag = t; renderFilters(); render(); }

function render() {
  const grid = document.getElementById("grid");
  const list = posts.filter(p => activeTag === "전체" || p.tags.includes(activeTag));
  if (!list.length) { grid.innerHTML = '<div class="empty">게시물이 없습니다. URL을 붙여넣어 추가해 보세요.</div>'; return; }
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="embed">
        <div class="play"></div>
        <span>여기에 X 공식 임베드 플레이어가 렌더링됩니다</span>
        <span class="placeholder-note">widgets.js embed</span>
      </div>
      <div class="card-body">
        <div class="author">
          <div class="avatar">${p.authorName[0]}</div>
          <div>
            <div class="name">${p.authorName}</div>
            <div class="handle">${p.authorHandle} · ${p.date}</div>
          </div>
        </div>
        <div class="text">${p.text}</div>
        <div class="meta">
          <div class="tags">${p.tags.map(t => `<span class="tag">#${t}</span>`).join("")}</div>
          <div class="actions">
            <a href="${p.tweetUrl}" target="_blank" rel="noopener">원본 보기 ↗</a>
            <button onclick="removePost(${p.id})">삭제</button>
          </div>
        </div>
      </div>
    </div>
  `).join("");
}

function addPost() {
  const url = document.getElementById("urlInput").value.trim();
  const tagRaw = document.getElementById("tagInput").value.trim();
  if (!/^https?:\/\/(www\.)?(x|twitter)\.com\/.+\/status\/\d+/.test(url)) {
    toast("X 게시물 URL 형식이 아닙니다 (예: https://x.com/사용자/status/123)");
    return;
  }
  const tags = tagRaw ? tagRaw.split(/[,#\s]+/).filter(Boolean) : ["태그없음"];
  posts.unshift({ id: Date.now(), tweetUrl: url, authorName: "새 게시물", authorHandle: "@new", text: "추가된 게시물입니다. 실제 서비스에서는 oEmbed로 작성자·본문을 자동 가져옵니다.", tags, date: new Date().toISOString().slice(0,10) });
  document.getElementById("urlInput").value = "";
  document.getElementById("tagInput").value = "";
  renderFilters(); render();
  toast("게시물이 추가되었습니다");
}

function removePost(id) {
  posts = posts.filter(p => p.id !== id);
  renderFilters(); render();
  toast("삭제되었습니다");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

renderFilters();
render();
</script>

</body>
</html>
